name: Automerge ticket PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: github.event.pull_request.base.ref == 'master' && startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Mark ready and squash-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ github.event.pull_request.number }}"
          STATE="$(gh pr view "$NUM" --repo "${{ github.repository }}" --json state --jq .state)"
          if [ "$STATE" = "MERGED" ]; then
            echo "already merged"
          else
            gh pr ready "$NUM" --repo "${{ github.repository }}" || true
            gh pr merge "$NUM" --repo "${{ github.repository }}" --squash --delete-branch
          fi
          # GITHUB_TOKEN merges do not trigger push workflows; kick deploy explicitly.
          gh workflow run "Deploy PyreChat" --repo "${{ github.repository }}" || true
